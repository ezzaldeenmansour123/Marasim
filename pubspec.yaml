name: marasim
description: "مراسم | MARASIM — منصة البروتوكول الدولي والمراسم والذكاء الاصطناعي"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  sqflite: ^2.4.6
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  # 23.x needs compileSdk 37, but the Actions runner cannot install the
  # android-37 platform (sdkmanager: package not found); 22.3.3 is the
  # last release that compiles against SDK 36.
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/marasim.db
    - assets/marasim.db.sha256
    - assets/logo.png
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
